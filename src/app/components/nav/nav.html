<header class="nav">
  <div class="nav__bar container">
    <a class="nav__brand" href="#top" (click)="scrollToTop($event)" aria-label="InviteVibe home">
      <app-logo layout="horizontal" />
    </a>

    <nav class="nav__links" aria-label="Primary">
      @for (link of links; track link.id) {
        <button type="button" class="nav__link" (click)="scrollTo(link.id)">{{ link.label }}</button>
      }
    </nav>

    <a class="btn btn-primary nav__cta" [href]="bookNowLink" target="_blank" rel="noopener" (click)="closeMenu()">
      Book now
    </a>

    <button
      type="button"
      class="nav__toggle"
      [class.nav__toggle--open]="menuOpen()"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="mobile-menu"
      aria-label="Toggle menu"
    >
      <span></span><span></span><span></span>
    </button>
  </div>

  <div class="nav__mobile" id="mobile-menu" [class.nav__mobile--open]="menuOpen()">
    <nav aria-label="Mobile">
      @for (link of links; track link.id) {
        <button type="button" class="nav__mobile-link" (click)="scrollTo(link.id)">{{ link.label }}</button>
      }
    </nav>
    <a class="btn btn-primary nav__mobile-cta" [href]="bookNowLink" target="_blank" rel="noopener" (click)="closeMenu()">
      Book now
    </a>
  </div>
</header>
