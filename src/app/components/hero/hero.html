<section class="hero" id="hero" #heroSection>
  <div class="hero__glow hero__glow--one" aria-hidden="true"></div>
  <div class="hero__glow hero__glow--two" aria-hidden="true"></div>
  <span class="hero__burst" #burst aria-hidden="true"></span>

  <svg class="hero__floral hero__floral--bl" #floralBl viewBox="0 0 120 160" fill="none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <path d="M6 152 C24 128 34 100 52 78 C64 63 74 52 88 34" stroke="rgba(255,255,255,0.4)" stroke-width="1.6" stroke-linecap="round" />
    <ellipse cx="18" cy="132" rx="9" ry="4" transform="rotate(-52 18 132)" fill="rgba(255,255,255,0.28)" />
    <ellipse cx="34" cy="106" rx="9.5" ry="4.2" transform="rotate(48 34 106)" fill="rgba(255,255,255,0.24)" />
    <ellipse cx="47" cy="82" rx="9" ry="4" transform="rotate(-46 47 82)" fill="rgba(255,255,255,0.28)" />
    <ellipse cx="62" cy="60" rx="8" ry="3.6" transform="rotate(50 62 60)" fill="rgba(255,255,255,0.22)" />
    <g transform="translate(88,34)">
      <ellipse cx="0" cy="-9" rx="4.6" ry="7.2" fill="rgba(255,255,255,0.32)" />
      <ellipse cx="0" cy="-9" rx="4.6" ry="7.2" fill="rgba(255,255,255,0.32)" transform="rotate(72)" />
      <ellipse cx="0" cy="-9" rx="4.6" ry="7.2" fill="rgba(255,255,255,0.32)" transform="rotate(144)" />
      <ellipse cx="0" cy="-9" rx="4.6" ry="7.2" fill="rgba(255,255,255,0.32)" transform="rotate(216)" />
      <ellipse cx="0" cy="-9" rx="4.6" ry="7.2" fill="rgba(255,255,255,0.32)" transform="rotate(288)" />
      <circle r="3.2" fill="#E9C46A" opacity="0.85" />
    </g>
  </svg>
  <svg class="hero__floral hero__floral--tr" #floralTr viewBox="0 0 120 160" fill="none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <path d="M6 152 C24 128 34 100 52 78 C64 63 74 52 88 34" stroke="rgba(255,255,255,0.4)" stroke-width="1.6" stroke-linecap="round" />
    <ellipse cx="18" cy="132" rx="9" ry="4" transform="rotate(-52 18 132)" fill="rgba(255,255,255,0.28)" />
    <ellipse cx="34" cy="106" rx="9.5" ry="4.2" transform="rotate(48 34 106)" fill="rgba(255,255,255,0.24)" />
    <ellipse cx="47" cy="82" rx="9" ry="4" transform="rotate(-46 47 82)" fill="rgba(255,255,255,0.28)" />
    <ellipse cx="62" cy="60" rx="8" ry="3.6" transform="rotate(50 62 60)" fill="rgba(255,255,255,0.22)" />
    <g transform="translate(88,34)">
      <ellipse cx="0" cy="-9" rx="4.6" ry="7.2" fill="rgba(255,255,255,0.32)" />
      <ellipse cx="0" cy="-9" rx="4.6" ry="7.2" fill="rgba(255,255,255,0.32)" transform="rotate(72)" />
      <ellipse cx="0" cy="-9" rx="4.6" ry="7.2" fill="rgba(255,255,255,0.32)" transform="rotate(144)" />
      <ellipse cx="0" cy="-9" rx="4.6" ry="7.2" fill="rgba(255,255,255,0.32)" transform="rotate(216)" />
      <ellipse cx="0" cy="-9" rx="4.6" ry="7.2" fill="rgba(255,255,255,0.32)" transform="rotate(288)" />
      <circle r="3.2" fill="#E9C46A" opacity="0.85" />
    </g>
  </svg>

  <div class="hero__petals" #petals aria-hidden="true">
    @for (petal of petalSet; track petal.id) {
      <span class="hero__petal" [style.width.px]="petal.size" [style.height.px]="petal.size">
        <svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" xmlns="http://www.w3.org/2000/svg">
          <g transform="translate(12,12)">
            <ellipse cx="0" cy="-6" rx="3.2" ry="5" [attr.fill]="petal.color" />
            <ellipse cx="0" cy="-6" rx="3.2" ry="5" [attr.fill]="petal.color" transform="rotate(72)" />
            <ellipse cx="0" cy="-6" rx="3.2" ry="5" [attr.fill]="petal.color" transform="rotate(144)" />
            <ellipse cx="0" cy="-6" rx="3.2" ry="5" [attr.fill]="petal.color" transform="rotate(216)" />
            <ellipse cx="0" cy="-6" rx="3.2" ry="5" [attr.fill]="petal.color" transform="rotate(288)" />
            <circle r="2" fill="#E9C46A" />
          </g>
        </svg>
      </span>
    }
  </div>

  <div class="container hero__inner" #heroContent>
    <span class="eyebrow eyebrow--on-hero">Custom Invitation Design Studio</span>
    <h1>Design that fits every celebration</h1>
    <p class="hero__subline">
      From weddings and engagements to birthdays and baby showers — thoughtfully designed
      invitations for every milestone worth celebrating.
    </p>
    <div class="hero__ctas">
      <button type="button" class="btn btn-primary" (click)="scrollTo('portfolio')">See our work</button>
      <button type="button" class="btn btn-ghost-light" (click)="scrollTo('contact')">Book now</button>
    </div>
  </div>

  <div class="hero__cover" #cover aria-hidden="true">
    <span class="hero__cover-sparkle" #sparkle>
      <svg viewBox="0 0 24 24" width="22" height="22" fill="#E9C46A" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 0 L14.2 9.8 L24 12 L14.2 14.2 L12 24 L9.8 14.2 L0 12 L9.8 9.8 Z" />
      </svg>
    </span>
    <span class="hero__cover-seal">
      <svg viewBox="0 0 48 48" width="34" height="34" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="4" y="12" width="34" height="24" rx="4" fill="#5B4B8A" />
        <path d="M4 14 L21 27 L38 14" stroke="#F8F6FB" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </span>
    <span class="hero__cover-word">InviteVibe</span>
  </div>
</section>
