<article class="pricing-card" #card [class.pricing-card--featured]="tier().featured">
  @if (tier().featured) {
    <span class="pricing-card__badge">Most popular</span>
  }

  <h3 class="pricing-card__name">{{ tier().name }}</h3>
  <p class="pricing-card__price">{{ tier().startingFrom }}</p>
  <p class="pricing-card__desc">{{ tier().description }}</p>

  <ul class="pricing-card__features">
    @for (feature of tier().features; track feature) {
      <li>
        <svg viewBox="0 0 20 20" width="16" height="16" fill="none" aria-hidden="true">
          <circle cx="10" cy="10" r="10" [attr.fill]="tier().featured ? '#E9C46A' : '#D8B4E2'" />
          <path d="M6 10.2 L8.6 12.8 L14 7" stroke="#3D3163" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span>{{ feature }}</span>
      </li>
    }
  </ul>

  <button
    type="button"
    class="btn pricing-card__cta"
    [class.btn-primary]="tier().featured"
    [class.btn-outline]="!tier().featured"
    (click)="choose.emit(tier().id)"
  >
    Enquire about {{ tier().name }}
  </button>
</article>
