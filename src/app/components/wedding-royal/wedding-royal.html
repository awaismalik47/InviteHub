<app-invitation-cover [config]="config()" />
<app-music-player [musicSrc]="config().musicSrc" [slug]="slug()" />

<section class="wedding-royal__message" id="message">
  <div class="container wedding-royal__message-inner" #message>
    <span class="wedding-royal__divider" aria-hidden="true"><i></i><svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M12 21s-7.5-4.6-10-9.1C.4 8.6 2 5 5.6 5 8 5 10 6.4 12 9c2-2.6 4-4 6.4-4C22 5 23.6 8.6 22 11.9 19.5 16.4 12 21 12 21z"/></svg><i></i></span>
    <p>
      We are honored to welcome you to the wedding ceremony of {{ config().groom.name }} &amp; {{ config().bride.name }}. As
      they begin their journey together in faith and love,<br />
      we thank you for being part of this blessed occasion
      <svg class="wedding-royal__inline-heart" viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M12 21s-7.5-4.6-10-9.1C.4 8.6 2 5 5.6 5 8 5 10 6.4 12 9c2-2.6 4-4 6.4-4C22 5 23.6 8.6 22 11.9 19.5 16.4 12 21 12 21z"/></svg>
    </p>
    <span class="wedding-royal__divider" aria-hidden="true"><i></i><svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M12 21s-7.5-4.6-10-9.1C.4 8.6 2 5 5.6 5 8 5 10 6.4 12 9c2-2.6 4-4 6.4-4C22 5 23.6 8.6 22 11.9 19.5 16.4 12 21 12 21z"/></svg><i></i></span>
  </div>
</section>

<app-scratch-card />
<app-calendar-buttons [config]="config()" />

<app-gallery [config]="config()" />
<app-countdown [weddingDate]="config().weddingDate" />
<app-event-timeline [config]="config()" />
<app-venue-section [config]="config()" />
@if (config().dressCode) {
  <app-dress-code [dressCode]="config().dressCode!" />
}
<app-rsvp-form [slug]="slug()" [whatsappNumber]="config().whatsappNumber" />
<app-final-section [config]="config()" />
