<section class="gallery" id="gallery">
  <div class="container gallery__heading" #heading>
    <span class="gallery__divider" aria-hidden="true">
      <i></i>
      <svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor"><path d="M12 21s-7.5-4.6-10-9.1C.4 8.6 2 5 5.6 5 8 5 10 6.4 12 9c2-2.6 4-4 6.4-4C22 5 23.6 8.6 22 11.9 19.5 16.4 12 21 12 21z"/></svg>
      <i></i>
    </span>
  </div>

  @if (config().gallery.length) {
    <swiper-container #swiperEl init="false" class="gallery__swiper">
      @for (photo of config().gallery; track photo) {
        <swiper-slide class="gallery__slide">
          <img [src]="photo" alt="" loading="lazy" />
        </swiper-slide>
      }
    </swiper-container>
  } @else {
    <div class="container">
      <div class="gallery__empty">
        <span aria-hidden="true">✦</span>
        <p>Photos from the celebration will appear here soon.</p>
      </div>
    </div>
  }
</section>
