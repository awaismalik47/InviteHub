<section #section class="invitation-cover" aria-label="Invitation cover">
  <h1 class="visually-hidden">{{ config().groom.name }} &amp; {{ config().bride.name }}</h1>

  @if (config().coverVideo) {
    <video
      #video
      class="invitation-cover__video"
      [src]="config().coverVideo"
      [poster]="config().coverPoster"
      muted
      playsinline
      preload="auto"
    ></video>
  } @else {
    <div class="invitation-cover__fallback" [style.backgroundImage]="config().coverPoster ? 'url(' + config().coverPoster + ')' : null"></div>
  }

  @if (config().coverVideo) {
    <button
      type="button"
      class="invitation-cover__toggle"
      (click)="togglePlay()"
      [attr.aria-pressed]="playing()"
      [attr.aria-label]="playing() ? 'Pause video' : 'Play video'"
    >
      @if (playing()) {
        <svg viewBox="0 0 24 24" width="18" height="18" fill="#fff2d6"><path d="M7 5h3v14H7zM14 5h3v14h-3z" /></svg>
      } @else {
        <svg viewBox="0 0 24 24" width="18" height="18" fill="#fff2d6"><path d="M8 5.5v13l11-6.5-11-6.5Z" /></svg>
      }
    </button>
  }

  @if (finished()) {
    <div class="invitation-cover__scroll-cue" aria-hidden="true">
      <span class="invitation-cover__scroll-label">Scroll Down</span>
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 4v15M6 13l6 6 6-6" />
      </svg>
    </div>
  }
</section>
