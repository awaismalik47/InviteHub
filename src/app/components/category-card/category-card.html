<article class="category-card" #card tabindex="0">
  <span class="category-card__icon">
    @switch (category().icon) {
      @case ('rings') {
        <svg viewBox="0 0 40 40" width="26" height="26" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="15" cy="24" r="9" stroke="currentColor" stroke-width="2.4" />
          <circle cx="25" cy="24" r="9" stroke="currentColor" stroke-width="2.4" />
        </svg>
      }
      @case ('heart') {
        <svg viewBox="0 0 40 40" width="26" height="26" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M20 32 C8 24 4 17 8 12 C11 8.5 17 9 20 14 C23 9 29 8.5 32 12 C36 17 32 24 20 32Z" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" />
        </svg>
      }
      @case ('balloon') {
        <svg viewBox="0 0 40 40" width="26" height="26" fill="none" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="20" cy="16" rx="10" ry="12" stroke="currentColor" stroke-width="2.2" />
          <path d="M20 28 L20 34" stroke="currentColor" stroke-width="2" />
          <path d="M17 34 L23 34" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>
      }
      @case ('stork') {
        <svg viewBox="0 0 40 40" width="26" height="26" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="20" cy="16" r="8" stroke="currentColor" stroke-width="2.2" />
          <path d="M14 30 C14 24 26 24 26 30" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
          <circle cx="17" cy="14" r="1.4" fill="currentColor" />
        </svg>
      }
      @case ('anniversary') {
        <svg viewBox="0 0 40 40" width="26" height="26" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M20 6 L23.4 16.6 L34 20 L23.4 23.4 L20 34 L16.6 23.4 L6 20 L16.6 16.6 Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
        </svg>
      }
      @case ('briefcase') {
        <svg viewBox="0 0 40 40" width="26" height="26" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="7" y="15" width="26" height="17" rx="2.5" stroke="currentColor" stroke-width="2.2" />
          <path d="M14 15 V11.5 C14 10.1 15.1 9 16.5 9 H23.5 C24.9 9 26 10.1 26 11.5 V15" stroke="currentColor" stroke-width="2.2" />
        </svg>
      }
    }
  </span>
  <h3 class="category-card__label">{{ category().label }}</h3>
  <p class="category-card__desc">{{ category().description }}</p>
</article>
