<app-nav />
<main>
  <app-hero />

  @for (category of templateCategories; track category.id; let last = $last) {
    <app-template-carousel [eyebrow]="category.eyebrow" [heading]="category.heading" [items]="category.items" />
    @if (!last) {
      <app-section-connector />
    }
  }

  <app-how-it-works />
  <app-pricing />
  <app-reviews [reviews]="reviews" />
  <app-contact />
</main>
<app-footer />
